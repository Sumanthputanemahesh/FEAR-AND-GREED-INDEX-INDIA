name: India FGI Intraday Estimate

on:
  schedule:
    # Hourly, 04:00-10:00 UTC, weekdays. NSE trades 09:15-15:30 IST, which
    # is 03:45-10:00 UTC year-round (India doesn't observe DST). The script
    # itself checks whether today's bar actually exists yet and skips
    # cleanly if the market hasn't opened, so this window is fine as-is.
    - cron: "0 4-10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update intraday estimate
        run: python scripts/intraday_update.py

      - name: Commit intraday snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/intraday.json
          if git diff --cached --quiet; then
            echo "No intraday changes to commit."
          else
            git commit -m "Intraday update $(date -u +%H:%M) UTC"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "Push rejected, pulling and retrying ($i/3)..."
              git pull --rebase origin main
              sleep $((i * 3))
            done
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
