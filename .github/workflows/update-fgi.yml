name: Update India Fear & Greed Index

on:
  schedule:
    # 12:30 UTC = 18:00 IST, comfortably after NSE close (15:30 IST) and after
    # the F&O bhavcopy is published. Cron is always UTC on GitHub Actions.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data back

concurrency:
  group: fgi-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # first run backfills PCR and is slow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Build index
        run: python build_india_fgi.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update India FGI — $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Upload build report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: data/build_report.json
          if-no-files-found: warn
